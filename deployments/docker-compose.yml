version: '3.8'

services:
  mosquitto_downstream:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_unioeste_downstream
    restart: unless-stopped
    ports:
      - "1884:1883" # Porta 1883 interna do Mosquitto exposta como 1884 no host
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_unioeste
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" # Interface web/API do Prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite ao Prometheus acessar serviços rodando no host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_unioeste
    restart: unless-stopped
    ports:
      - "3000:3000" # Interface web do Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_storage:/var/lib/grafana

volumes:
  grafana_storage: